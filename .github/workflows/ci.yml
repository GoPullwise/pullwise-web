name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run lint && npm run test
      - name: Build browser-check assets
        env:
          VITE_APP_URL: http://127.0.0.1:4248
          VITE_API_BASE_URL: /api
          VITE_GITHUB_APP_SLUG: gopullwise-preview
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check date-field layouts across browser engines
        run: npm run test:layout
      - name: Check phone and tablet layouts in Chromium and WebKit
        run: npm run test:mobile-layout
      - name: Check Billing usage layouts
        run: npm run test:billing-layout -- --browser=chromium
      - name: Check spending overview composition layouts
        run: npm run test:overview-layout -- --browser=chromium
      - name: Check currency picker interactions and layouts
        run: npm run test:currency-layout
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check Cloudflare worker syntax
        run: node --check worker.js
